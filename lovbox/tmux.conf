# Lovbox adds recovery to the shared keys, colors, and session picker.
source-file ~/kod/dotfiles/terminal/tmux.conf
set -g default-shell /usr/bin/zsh

set -g @resurrect-dir '~/.local/state/lovbox/tmux'
set -g @resurrect-capture-pane-contents 'on'
# Relaunch editors and conversation pickers, without restarting builds.
set -g @resurrect-processes '"~codex->codex resume" "~process-compose process list->process-compose process list"'
set -g @resurrect-hook-pre-restore-all 'tmux set-option -g @lovbox-restoring on'
set -g @resurrect-hook-post-restore-all 'tmux set-option -g @lovbox-restoring off'

run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
# Use one locked save path for shortcuts, hooks, and continuum.
set -g @resurrect-save-script-path "$HOME/kod/dotfiles/lovbox/tmux-save.sh"
bind C-s run-shell '~/kod/dotfiles/lovbox/tmux-save.sh'
set -g @continuum-save-interval '1'
# The launcher restores synchronously before creating main and morgan-os.
set -g @continuum-restore 'off'
run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux

set-hook -g after-new-session 'run-shell -b "~/kod/dotfiles/lovbox/tmux-save.sh --delay"'
set-hook -g after-new-window 'run-shell -b "~/kod/dotfiles/lovbox/tmux-save.sh --delay"'
set-hook -g after-split-window 'run-shell -b "~/kod/dotfiles/lovbox/tmux-save.sh --delay"'
set-hook -g after-kill-pane 'run-shell -b "~/kod/dotfiles/lovbox/tmux-save.sh --delay"'
set-hook -g client-detached 'run-shell -b "~/kod/dotfiles/lovbox/tmux-save.sh"'
